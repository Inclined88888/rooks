[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooks-try"
version = "0.1.0"
description = "A disposable computer on this machine for the agent to try things, without touching your real desktop"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mss>=9",
  "Pillow>=10",
  "python-xlib>=0.33; sys_platform == 'linux'",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rooks-try = "rooks_try.cli:main"

[tool.setuptools]
packages = ["rooks_try", "rooks_try.drivers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
