<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" role="img" aria-labelledby="title desc">
  <title id="title">The building blocks of Rooks</title>
  <desc id="desc">The desktop app, the web app and the rooks CLI talk to the Rooks daemon over its HTTP API and live updates. The daemon runs agents and missions, the Kanban dispatcher, triggers and the plugin host, serves the built-in MCP servers rooks and nova_ask, and keeps its data in the Rooks home. It starts each agent's CLI (Claude Code, Codex, opencode and others) in the agent's working folder; the agent calls Rooks back through the MCP servers. Each CLI reaches its model provider with your own subscription.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f1b18; }
    .t { font-size: 14px; font-weight: 650; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 12px; fill: #55504c; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #7a706a; }
    .l { font-size: 11.5px; fill: #3d3835; }
    .ar { stroke: #6f6762; stroke-width: 1.6; fill: none; }
    .client { fill: #edf2f8; stroke: #4f6d8c; stroke-width: 1.4; }
    .daemon { fill: #fcefea; stroke: #9b402c; stroke-width: 1.8; }
    .part { fill: #ffffff; stroke: #d3c4bc; stroke-width: 1.2; }
    .agent { fill: #edf6ef; stroke: #3f7a4f; stroke-width: 1.4; }
    .ext { fill: #ffffff; stroke: #8c837d; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6f6762"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="629" rx="12" fill="#fbf9f7" stroke="#e7e0db"/>

  <text class="k" x="24" y="30">CLIENTS</text>
  <rect class="client" x="24" y="40" width="220" height="78" rx="9"/>
  <text class="t" x="134" y="64" text-anchor="middle">Desktop app</text>
  <text class="s" x="134" y="84" text-anchor="middle">Windows, macOS, Linux</text>
  <text class="s" x="134" y="102" text-anchor="middle">bundles daemon and web app</text>

  <rect class="client" x="270" y="40" width="220" height="78" rx="9"/>
  <text class="t" x="380" y="64" text-anchor="middle">Web app</text>
  <text class="s" x="380" y="84" text-anchor="middle">the interface in a browser</text>
  <text class="s" x="380" y="102" text-anchor="middle">plugins add widgets, pages</text>

  <rect class="client" x="516" y="40" width="220" height="78" rx="9"/>
  <text class="t" x="626" y="64" text-anchor="middle">rooks CLI</text>
  <text class="s" x="626" y="84" text-anchor="middle">in your terminal</text>
  <text class="s" x="626" y="102" text-anchor="middle">for commands and scripts</text>

  <path class="ar" d="M134 122V166" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="ar" d="M380 122V166" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="ar" d="M626 122V166" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="392" y="148">HTTP API + live updates</text>

  <rect class="daemon" x="24" y="170" width="712" height="232" rx="11"/>
  <text class="h" x="44" y="196">Rooks daemon</text>
  <text class="s" x="44" y="215">runs in the background under your system's service manager, on loopback by default</text>

  <rect class="part" x="44" y="230" width="159" height="88" rx="8"/>
  <text class="t" x="123.5" y="255" text-anchor="middle">Agents &amp; missions</text>
  <text class="s" x="123.5" y="276" text-anchor="middle">runs each agent,</text>
  <text class="s" x="123.5" y="293" text-anchor="middle">keeps every history</text>

  <rect class="part" x="215" y="230" width="159" height="88" rx="8"/>
  <text class="t" x="294.5" y="255" text-anchor="middle">Kanban dispatcher</text>
  <text class="s" x="294.5" y="276" text-anchor="middle">starts each task</text>
  <text class="s" x="294.5" y="293" text-anchor="middle">once it is ready</text>

  <rect class="part" x="386" y="230" width="159" height="88" rx="8"/>
  <text class="t" x="465.5" y="255" text-anchor="middle">Triggers</text>
  <text class="s" x="465.5" y="276" text-anchor="middle">schedules, webhooks,</text>
  <text class="s" x="465.5" y="293" text-anchor="middle">events, routines</text>

  <rect class="part" x="557" y="230" width="159" height="88" rx="8"/>
  <text class="t" x="636.5" y="255" text-anchor="middle">Plugin host</text>
  <text class="s" x="636.5" y="276" text-anchor="middle">runs the host half</text>
  <text class="s" x="636.5" y="293" text-anchor="middle">of each plugin</text>

  <rect class="part" x="44" y="330" width="330" height="56" rx="8"/>
  <text class="t" x="209" y="354" text-anchor="middle">Built-in MCP servers</text>
  <text class="s" x="209" y="373" text-anchor="middle">rooks (act on Rooks) · nova_ask (ask you)</text>

  <rect class="part" x="386" y="330" width="330" height="56" rx="8"/>
  <text class="t" x="551" y="354" text-anchor="middle">Rooks home</text>
  <text class="s" x="551" y="373" text-anchor="middle">config, database, agents, skills, plugins</text>

  <path class="ar" d="M122 406V450" marker-end="url(#arrow)"/>
  <path class="ar" d="M146 450V406" marker-end="url(#arrow)"/>
  <path class="ar" d="M368 406V450" marker-end="url(#arrow)"/>
  <path class="ar" d="M392 450V406" marker-end="url(#arrow)"/>
  <path class="ar" d="M614 406V450" marker-end="url(#arrow)"/>
  <path class="ar" d="M638 450V406" marker-end="url(#arrow)"/>
  <text class="l" x="404" y="424">starts the CLI, follows it</text>
  <text class="l" x="404" y="441">the agent calls Rooks tools</text>

  <rect class="agent" x="24" y="454" width="220" height="70" rx="9"/>
  <text class="t" x="134" y="481" text-anchor="middle">Claude Code</text>
  <text class="s" x="134" y="503" text-anchor="middle">in the agent's working folder</text>

  <rect class="agent" x="270" y="454" width="220" height="70" rx="9"/>
  <text class="t" x="380" y="481" text-anchor="middle">Codex</text>
  <text class="s" x="380" y="503" text-anchor="middle">in the agent's working folder</text>

  <rect class="agent" x="516" y="454" width="220" height="70" rx="9"/>
  <text class="t" x="626" y="481" text-anchor="middle">opencode, Copilot, …</text>
  <text class="s" x="626" y="503" text-anchor="middle">in the agent's working folder</text>

  <path class="ar" d="M134 528V558" marker-end="url(#arrow)"/>
  <path class="ar" d="M380 528V558" marker-end="url(#arrow)"/>
  <path class="ar" d="M626 528V558" marker-end="url(#arrow)"/>

  <rect class="ext" x="24" y="562" width="712" height="46" rx="9"/>
  <text class="s" x="380" y="590" text-anchor="middle">Model providers, reached by each CLI with your own subscription</text>
</svg>
