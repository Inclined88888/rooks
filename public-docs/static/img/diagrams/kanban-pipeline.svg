<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" role="img" aria-labelledby="title desc">
  <title id="title">The Kanban pipelines</title>
  <desc id="desc">Full pipeline: a code task with a diff gets a review task; a pass verdict creates a merge task; once merged, a doc task follows if an agent holds the librarian role. Changes requested send the work back to another code round, three rounds at most; when the third is still not approved, or with a verdict Timon cannot read, the task is blocked and waits for you. code-self: the coder merges its own branch and closes with the merge SHA, with no review and no doc task. code-group: one final merge task integrates a group of code tasks, with no automatic review.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f1b18; }
    .t { font-size: 15px; font-weight: 700; }
    .r { font-size: 12px; font-weight: 600; fill: #9b402c; }
    .s { font-size: 12px; fill: #55504c; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #7a706a; }
    .l { font-size: 11.5px; fill: #3d3835; }
    .p { font-size: 13px; font-weight: 650; }
    .ar { stroke: #6f6762; stroke-width: 1.6; fill: none; }
    .back { stroke: #9b402c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .stage { fill: #ffffff; stroke: #d3c4bc; stroke-width: 1.2; }
    .code { fill: #edf2f8; stroke: #4f6d8c; stroke-width: 1.4; }
    .stop { fill: #fcefea; stroke: #9b402c; stroke-width: 1.6; }
    .note { fill: #ffffff; stroke: #d3c4bc; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6f6762"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9b402c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="515" rx="12" fill="#fbf9f7" stroke="#e7e0db"/>

  <text class="k" x="34" y="36">FULL PIPELINE (DEFAULT)</text>

  <rect class="code" x="34" y="60" width="128" height="100" rx="9"/>
  <text class="t" x="98" y="88" text-anchor="middle">code</text>
  <text class="r" x="98" y="108" text-anchor="middle">coder</text>
  <text class="s" x="98" y="130" text-anchor="middle">own branch and</text>
  <text class="s" x="98" y="146" text-anchor="middle">worktree</text>

  <rect class="stage" x="222" y="60" width="128" height="100" rx="9"/>
  <text class="t" x="286" y="88" text-anchor="middle">review</text>
  <text class="r" x="286" y="108" text-anchor="middle">reviewer</text>
  <text class="s" x="286" y="130" text-anchor="middle">reads the diff,</text>
  <text class="s" x="286" y="146" text-anchor="middle">gives a verdict</text>

  <rect class="stage" x="410" y="60" width="128" height="100" rx="9"/>
  <text class="t" x="474" y="88" text-anchor="middle">merge</text>
  <text class="r" x="474" y="108" text-anchor="middle">merger</text>
  <text class="s" x="474" y="130" text-anchor="middle">integrates the</text>
  <text class="s" x="474" y="146" text-anchor="middle">branch</text>

  <rect class="stage" x="598" y="60" width="128" height="100" rx="9"/>
  <text class="t" x="662" y="88" text-anchor="middle">doc</text>
  <text class="r" x="662" y="108" text-anchor="middle">librarian</text>
  <text class="s" x="662" y="130" text-anchor="middle">documents the</text>
  <text class="s" x="662" y="146" text-anchor="middle">change</text>

  <text class="l" x="192" y="102" text-anchor="middle">a diff</text>
  <path class="ar" d="M164 112H220" marker-end="url(#arrow)"/>
  <text class="l" x="380" y="102" text-anchor="middle">pass</text>
  <path class="ar" d="M352 112H408" marker-end="url(#arrow)"/>
  <text class="l" x="568" y="102" text-anchor="middle">merged</text>
  <path class="ar" d="M540 112H596" marker-end="url(#arrow)"/>

  <text class="s" x="662" y="182" text-anchor="middle">only if an agent holds</text>
  <text class="s" x="662" y="198" text-anchor="middle">the librarian role</text>

  <path class="back" d="M262 162V200H98V164" marker-end="url(#arrow-back)"/>
  <text class="l" x="106" y="220">changes requested:</text>
  <text class="l" x="106" y="236">another code round,</text>
  <text class="l" x="106" y="252">3 rounds at most</text>

  <path class="back" d="M330 162V291H408" marker-end="url(#arrow-back)"/>
  <rect class="stop" x="410" y="258" width="316" height="66" rx="9"/>
  <text class="p" x="426" y="281">Blocked: waits for you</text>
  <text class="s" x="426" y="299">third round still not approved,</text>
  <text class="s" x="426" y="315">or a verdict Timon cannot read</text>

  <text class="k" x="34" y="364">OTHER PIPELINES</text>

  <rect class="code" x="34" y="374" width="128" height="52" rx="9"/>
  <text class="p" x="98" y="405" text-anchor="middle">code-self</text>
  <path class="ar" d="M164 400H220" marker-end="url(#arrow)"/>
  <rect class="note" x="222" y="374" width="504" height="52" rx="9"/>
  <text class="s" x="238" y="396">The coder merges its own branch and closes</text>
  <text class="s" x="238" y="414">with the merge SHA. No review, no doc task.</text>

  <rect class="code" x="34" y="440" width="128" height="52" rx="9"/>
  <text class="p" x="98" y="471" text-anchor="middle">code-group</text>
  <path class="ar" d="M164 466H220" marker-end="url(#arrow)"/>
  <rect class="note" x="222" y="440" width="504" height="52" rx="9"/>
  <text class="s" x="238" y="462">Code tasks form a group; one final merge task</text>
  <text class="s" x="238" y="480">integrates them all. No automatic review.</text>
</svg>
