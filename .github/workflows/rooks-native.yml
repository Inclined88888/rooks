# The new Rooks window (desktop/rooks-native). Separate from the AI Workspace desktop-v* releases.
# A tag rooks-native-v* builds a Mac disk image (Apple silicon and Intel), a Linux .deb, and a Windows installer,
# then publishes them on that tag. The old desktop app is not touched.
name: Rooks window

on:
  pull_request:
    paths:
      - desktop/rooks-native/**
      - .github/workflows/rooks-native.yml
  push:
    tags: ["rooks-native-v*"]

permissions:
  contents: read

concurrency:
  group: rooks-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux .deb
            os: ubuntu-22.04
            artifact: rooks-native_0.4.0_amd64.deb
          - name: macOS Apple silicon
            os: macos-15
            artifact: Rooks_0.4.0_aarch64.dmg
          - name: macOS Intel
            os: macos-15-intel
            artifact: Rooks_0.4.0_x86_64.dmg
          - name: Windows installer
            os: windows-2022
            artifact: Rooks_0.4.0_x64.msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev dpkg-dev
      - name: Build
        working-directory: desktop/rooks-native
        run: cargo build --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash desktop/rooks-native/pack/linux-deb.sh \
            desktop/rooks-native/target/release/rooks-native \
            "${{ matrix.artifact }}"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash desktop/rooks-native/pack/macos-dmg.sh \
            desktop/rooks-native/target/release/rooks-native \
            "${{ matrix.artifact }}"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wix = Join-Path $env:RUNNER_TEMP "wix"
          New-Item -ItemType Directory -Force -Path $wix | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$wix\wix.zip"
          Expand-Archive "$wix\wix.zip" -DestinationPath $wix
          Copy-Item desktop\rooks-native\target\release\rooks-native.exe desktop\rooks-native\pack\rooks-native.exe
          Copy-Item desktop\rooks-native\assets\app-icon.ico desktop\rooks-native\pack\app-icon.ico
          Push-Location desktop\rooks-native\pack
          & "$wix\candle.exe" Rooks.wxs
          & "$wix\light.exe" -sval -o "$env:GITHUB_WORKSPACE\${{ matrix.artifact }}" Rooks.wixobj
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Publish this file on the Rooks release
        if: startsWith(github.ref, 'refs/tags/rooks-native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Rooks ${TAG#rooks-native-}" --notes-file desktop/rooks-native/pack/RELEASE.txt
          gh release upload "$TAG" "${{ matrix.artifact }}" --clobber
