name: Feature request
description: Something Timon could do, or do better.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: plugin
    attributes:
      label: Could it be a plugin?
      description: Many features fit in a plugin without changing Timon itself. Say if you have tried.
