[package]
name = "ai-workspace-desktop"
version = "1.0.6"
description = "The Rooks app"
authors = ["Inclined88888"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_workspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2" # feat/v02-anywhere-voice: Ask from anywhere
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
log = "0.4"

# The sidecar's kill-on-close job (design 0011, section 3) and the wait for a sidecar to end on its own.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Off by default: the in-app updater needs a signing key pair first (docs/desktop-release.md).
# CI turns it on with `--features updater` only when the TAURI_SIGNING_PRIVATE_KEY secret exists.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
