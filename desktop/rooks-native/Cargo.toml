[package]
name = "rooks-native"
version = "0.4.0"
description = "Rooks window. Its own UI, on this computer, with no web view."
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "rooks_native"
path = "src/lib.rs"

[[bin]]
name = "rooks-native"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2.12", features = ["json"] }
